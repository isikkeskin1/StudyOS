services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: studyos
      POSTGRES_USER: studyos
      POSTGRES_PASSWORD: studyos
    ports:
      - "5432:5432"
    volumes:
      - studyos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyos -d studyos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  studyos_postgres:
