name: Desktop Windows

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "web/**"
      - ".github/workflows/desktop-windows.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "web/**"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build local backend sidecar
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e backend pyinstaller
          pyinstaller --noconfirm --clean --onefile --name StudyOSBackend --paths backend --distpath desktop/build/backend --workpath desktop/build/pyinstaller-work --specpath desktop/build desktop/backend_launcher.py
          if (!(Test-Path "desktop/build/backend/StudyOSBackend.exe")) {
            throw "Missing bundled StudyOS backend executable"
          }

      - name: Smoke bundled backend
        shell: pwsh
        run: |
          $dbPath = (Join-Path $env:RUNNER_TEMP "studyos-desktop-smoke.db").Replace("\\", "/")
          $uploadPath = Join-Path $env:RUNNER_TEMP "studyos-desktop-uploads"
          $env:STUDYOS_ENV = "desktop"
          $env:STUDYOS_DESKTOP_PORT = "8765"
          $env:STUDYOS_DATABASE_URL = "sqlite:///$dbPath"
          $env:STUDYOS_DATA_DIR = $uploadPath
          $env:STUDYOS_TUTOR_PROVIDER = "local"
          $env:STUDYOS_TUTOR_EMBEDDING_PROVIDER = "none"
          $process = Start-Process "desktop/build/backend/StudyOSBackend.exe" -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try {
                $response = Invoke-WebRequest "http://127.0.0.1:8765/api/v1/health/ready" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $ready) {
              throw "Bundled StudyOS backend did not become ready"
            }
          } finally {
            if (!$process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Build StudyOS web shell
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          STUDYOS_ENV: production
          STUDYOS_BACKEND_URL: http://127.0.0.1:9
        run: npm run build

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Verify desktop source
        working-directory: desktop
        shell: pwsh
        run: |
          node --check main.cjs
          node --check preload.cjs
          if (!(Test-Path "../web/.next/standalone/server.js")) {
            throw "Missing Next.js standalone server bundle"
          }
          if (!(Test-Path "build/backend/StudyOSBackend.exe")) {
            throw "Missing bundled StudyOS backend executable"
          }

      - name: Build Windows installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: studyos-windows
          path: |
            desktop/dist/*.exe
          if-no-files-found: error

      - name: Attach installers to published release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$env:RELEASE_TAG" desktop/dist/*.exe --clobber
