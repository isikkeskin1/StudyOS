name: Desktop Windows

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "web/**"
      - ".github/workflows/desktop-windows.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "web/**"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Align desktop version with release tag
        if: github.event_name == 'release'
        working-directory: desktop
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          $parts = $version.Split(".")
          if ($parts.Count -lt 3) {
            throw "Release tag must look like v0.53.0"
          }
          npm version "$version" --no-git-tag-version --allow-same-version
          Write-Host "Building StudyOS Desktop $version"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build local backend sidecar
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e backend pyinstaller
          $alembicPath = (Resolve-Path "backend/alembic").Path
          pyinstaller --noconfirm --clean --onedir --name StudyOSBackend --paths backend --add-data "$alembicPath;alembic" --distpath desktop/build/backend --workpath desktop/build/pyinstaller-work --specpath desktop/build desktop/backend_launcher.py
          if (!(Test-Path "desktop/build/backend/StudyOSBackend/StudyOSBackend.exe")) {
            throw "Missing bundled StudyOS backend executable"
          }

      - name: Smoke desktop legacy database migration
        shell: pwsh
        run: |
          $legacyRoot = Join-Path $env:RUNNER_TEMP "studyos-legacy"
          New-Item -ItemType Directory -Path $legacyRoot -Force | Out-Null
          $dbPath = Join-Path $legacyRoot "legacy.db"
          $uploadPath = Join-Path $legacyRoot "uploads"

          @'
          import sqlite3
          import sys

          path = sys.argv[1]
          connection = sqlite3.connect(path)
          try:
              connection.execute(
                  """
                  CREATE TABLE users (
                      id VARCHAR(36) PRIMARY KEY,
                      email VARCHAR(320) NOT NULL UNIQUE,
                      password_hash VARCHAR(512) NOT NULL,
                      created_at DATETIME NOT NULL
                  )
                  """
              )
              connection.commit()
          finally:
              connection.close()
          '@ | python - $dbPath

          $verifyScript = Join-Path $legacyRoot "verify-migration.py"
          @'
          import sqlite3
          import sys

          connection = sqlite3.connect(sys.argv[1])
          try:
              columns = {
                  row[1]
                  for row in connection.execute("PRAGMA table_info(users)").fetchall()
              }
              tables = {
                  row[0]
                  for row in connection.execute(
                      "SELECT name FROM sqlite_master WHERE type='table'"
                  ).fetchall()
              }
              required_tables = {
                  "alembic_version",
                  "catalog_courses",
                  "catalog_sources",
              }
              if "is_admin" not in columns:
                  raise SystemExit("users.is_admin was not migrated")
              missing = required_tables - tables
              if missing:
                  raise SystemExit(f"Missing migrated tables: {sorted(missing)}")
          finally:
              connection.close()
          '@ | Set-Content -Path $verifyScript -Encoding UTF8

          $env:STUDYOS_ENV = "desktop"
          $env:STUDYOS_DATABASE_URL = "sqlite:///$($dbPath -replace '\\','/')"
          $env:STUDYOS_DATA_DIR = $uploadPath
          $env:STUDYOS_DESKTOP_HOST = "127.0.0.1"
          $env:STUDYOS_DESKTOP_PORT = "8766"
          $backend = Start-Process "desktop/build/backend/StudyOSBackend/StudyOSBackend.exe" -PassThru
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 90; $attempt++) {
              try {
                $response = Invoke-WebRequest "http://127.0.0.1:8766/api/v1/health/ready" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $healthy = $true
                  break
                }
              } catch {}
              if ($backend.HasExited) {
                throw "Bundled backend exited during legacy database migration smoke"
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $healthy) {
              throw "Bundled backend never became ready after legacy database migration"
            }

            python $verifyScript $dbPath
            if ($LASTEXITCODE -ne 0) {
              throw "Legacy database migration verification failed"
            }
          } finally {
            if (-not $backend.HasExited) {
              Stop-Process -Id $backend.Id -Force
            }
          }

      - name: Smoke bundled backend
        shell: pwsh
        run: |
          $dbPath = (Join-Path $env:RUNNER_TEMP "studyos-desktop-smoke.db").Replace("\\", "/")
          $uploadPath = Join-Path $env:RUNNER_TEMP "studyos-desktop-uploads"
          $env:STUDYOS_ENV = "desktop"
          $env:STUDYOS_DESKTOP_PORT = "8765"
          $env:STUDYOS_DATABASE_URL = "sqlite:///$dbPath"
          $env:STUDYOS_DATA_DIR = $uploadPath
          $env:STUDYOS_TUTOR_PROVIDER = "local"
          $env:STUDYOS_TUTOR_EMBEDDING_PROVIDER = "none"
          $process = Start-Process "desktop/build/backend/StudyOSBackend/StudyOSBackend.exe" -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try {
                $response = Invoke-WebRequest "http://127.0.0.1:8765/api/v1/health/ready" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $ready) {
              throw "Bundled StudyOS backend did not become ready"
            }
          } finally {
            if (!$process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Build StudyOS web shell
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          STUDYOS_ENV: production
          STUDYOS_BACKEND_URL: http://127.0.0.1:9
        run: npm run build

      - name: Stage production web runtime
        shell: pwsh
        run: |
          $stage = "desktop/build/web"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage | Out-Null

          Copy-Item "web/.next/standalone/*" $stage -Recurse -Force
          New-Item -ItemType Directory -Path "$stage/.next/static" -Force | Out-Null
          Copy-Item "web/.next/static/*" "$stage/.next/static" -Recurse -Force
          Copy-Item "web/public" "$stage/public" -Recurse -Force

          Copy-Item "web/package.json" "$stage/package.json" -Force
          Copy-Item "web/package-lock.json" "$stage/package-lock.json" -Force

          Push-Location $stage
          npm ci --omit=dev --no-audit --no-fund
          Pop-Location

          if (!(Test-Path "$stage/server.js")) {
            throw "Missing staged Next.js server.js"
          }
          if (!(Test-Path "$stage/node_modules/next/package.json")) {
            throw "Missing staged Next.js runtime dependency"
          }

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Verify desktop source
        working-directory: desktop
        shell: pwsh
        run: |
          node --check main.cjs
          node --check preload.cjs
          if (!(Test-Path "build/web/server.js")) {
            throw "Missing staged Next.js server bundle"
          }
          if (!(Test-Path "build/web/node_modules/next/package.json")) {
            throw "Missing staged Next.js runtime dependency"
          }
          if (!(Test-Path "build/backend/StudyOSBackend/StudyOSBackend.exe")) {
            throw "Missing bundled StudyOS backend executable"
          }

      - name: Build Windows installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npm run dist:win

      - name: Verify release signature
        if: github.event_name == 'release'
        working-directory: desktop
        shell: pwsh
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CSC_LINK)) {
            Write-Host "No Windows signing certificate configured; release remains unsigned."
            exit 0
          }
          $setup = Get-ChildItem "dist/*Setup.exe" | Select-Object -First 1
          if (-not $setup) {
            throw "StudyOS setup installer was not produced"
          }
          $signature = Get-AuthenticodeSignature $setup.FullName
          if ($signature.Status -ne "Valid") {
            throw "StudyOS release installer signature is not valid: $($signature.Status)"
          }
          Write-Host "Verified signed StudyOS installer: $($signature.SignerCertificate.Subject)"

      - name: Verify desktop update metadata
        working-directory: desktop
        shell: pwsh
        run: |
          if (!(Test-Path "dist/latest.yml")) {
            throw "Missing latest.yml required for StudyOS automatic updates"
          }
          $setupBlockmap = Get-ChildItem "dist/*Setup.exe.blockmap" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setupBlockmap) {
            throw "Missing NSIS installer blockmap required for differential updates"
          }

      - name: Verify packaged web runtime
        working-directory: desktop
        shell: pwsh
        run: |
          if (!(Test-Path "dist/win-unpacked/resources/web/server.js")) {
            throw "Packaged StudyOS is missing web/server.js"
          }
          if (!(Test-Path "dist/win-unpacked/resources/web/node_modules/next/package.json")) {
            throw "Packaged StudyOS is missing the Next.js runtime"
          }

      - name: Smoke packaged installed payload
        working-directory: desktop
        shell: pwsh
        run: |
          $appExe = Resolve-Path "dist/win-unpacked/StudyOS.exe"
          $logPath = Join-Path $env:RUNNER_TEMP "studyos-packaged-desktop.log"
          Remove-Item $logPath -ErrorAction SilentlyContinue
          $env:STUDYOS_DESKTOP_LOG_PATH = $logPath
          $env:STUDYOS_DISABLE_AUTO_UPDATE = "1"
          $process = Start-Process $appExe -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 120; $attempt++) {
              if (Test-Path $logPath) {
                $log = Get-Content $logPath -Raw
                if ($log -match "StudyOS desktop ready at") {
                  $ready = $true
                  break
                }
                if ($log -match "StudyOS desktop startup failed") {
                  throw "Packaged StudyOS entered recovery mode. Log: $log"
                }
              }
              if ($process.HasExited) {
                $log = if (Test-Path $logPath) { Get-Content $logPath -Raw } else { "<no desktop log>" }
                throw "Packaged StudyOS exited before becoming ready. Log: $log"
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) {
              $log = if (Test-Path $logPath) { Get-Content $logPath -Raw } else { "<no desktop log>" }
              throw "Packaged StudyOS did not become ready. Log: $log"
            }

            $log = Get-Content $logPath -Raw
            $match = [regex]::Match($log, "StudyOS desktop ready at (http://127\.0\.0\.1:\d+)")
            if (-not $match.Success) {
              throw "Could not determine packaged StudyOS proxy origin. Log: $log"
            }
            $origin = $match.Groups[1].Value

            $health = Invoke-WebRequest "$origin/api/v1/health/ready" -UseBasicParsing -TimeoutSec 5
            if ($health.StatusCode -ne 200) {
              throw "Desktop proxy health check failed with HTTP $($health.StatusCode)"
            }

            $session = New-Object Microsoft.PowerShell.Commands.WebRequestSession
            $email = "desktop-smoke-$([guid]::NewGuid().ToString('N'))@example.com"
            $password = "desktop-smoke-password"
            $registerBody = @{ email = $email; password = $password } | ConvertTo-Json
            $registered = Invoke-WebRequest "$origin/api/v1/auth/register" -Method POST -ContentType "application/json" -Body $registerBody -WebSession $session -UseBasicParsing -TimeoutSec 10
            if ($registered.StatusCode -ne 201) {
              throw "Desktop proxy registration failed with HTTP $($registered.StatusCode)"
            }

            $me = Invoke-WebRequest "$origin/api/v1/auth/me" -WebSession $session -UseBasicParsing -TimeoutSec 5
            if ($me.StatusCode -ne 200) {
              throw "Desktop proxy authenticated request failed with HTTP $($me.StatusCode)"
            }

            Start-Sleep -Seconds 2
            if ($process.HasExited) {
              $log = Get-Content $logPath -Raw
              throw "Packaged StudyOS exited after real API traffic. Log: $log"
            }
          } finally {
            Get-Process StudyOS -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Get-Process StudyOSBackend -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: studyos-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.yml
            desktop/dist/*.blockmap
          if-no-files-found: error

      - name: Attach installers to published release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $assets = @()
          $assets += Get-ChildItem "desktop/dist/*.exe" -ErrorAction SilentlyContinue
          $assets += Get-ChildItem "desktop/dist/*.yml" -ErrorAction SilentlyContinue
          $assets += Get-ChildItem "desktop/dist/*.blockmap" -ErrorAction SilentlyContinue
          if (-not $assets) {
            throw "No desktop release assets were produced"
          }
          gh release upload "$env:RELEASE_TAG" @($assets.FullName) --clobber
