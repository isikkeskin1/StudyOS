name: Desktop Windows

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "desktop/**"
      - "web/**"
      - ".github/workflows/desktop-windows.yml"
  pull_request:
    paths:
      - "backend/**"
      - "desktop/**"
      - "web/**"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Align desktop version with release tag
        if: github.event_name == 'release'
        working-directory: desktop
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          $parts = $version.Split(".")
          if ($parts.Count -lt 3) {
            throw "Release tag must look like v0.53.0"
          }
          npm version "$version" --no-git-tag-version --allow-same-version
          Write-Host "Building StudyOS Desktop $version"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build local backend sidecar
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e backend pyinstaller
          $alembicPath = (Resolve-Path "backend/alembic").Path
          pyinstaller --noconfirm --clean --onedir --name StudyOSBackend --paths backend --add-data "$alembicPath;alembic" --distpath desktop/build/backend --workpath desktop/build/pyinstaller-work --specpath desktop/build desktop/backend_launcher.py
          if (!(Test-Path "desktop/build/backend/StudyOSBackend/StudyOSBackend.exe")) {
            throw "Missing bundled StudyOS backend executable"
          }

      - name: Smoke bundled backend migration
        shell: pwsh
        run: |
          $legacyRoot = Join-Path $env:RUNNER_TEMP "studyos-legacy"
          New-Item -ItemType Directory -Path $legacyRoot -Force | Out-Null
          $dbPath = Join-Path $legacyRoot "legacy.db"
          $uploadPath = Join-Path $legacyRoot "uploads"
          @'
          import sqlite3
          import sys
          connection = sqlite3.connect(sys.argv[1])
          try:
              connection.execute("CREATE TABLE users (id VARCHAR(36) PRIMARY KEY, email VARCHAR(320) NOT NULL UNIQUE, password_hash VARCHAR(512) NOT NULL, created_at DATETIME NOT NULL)")
              connection.commit()
          finally:
              connection.close()
          '@ | python - $dbPath
          $verifyScript = Join-Path $legacyRoot "verify-migration.py"
          @'
          import sqlite3
          import sys
          connection = sqlite3.connect(sys.argv[1])
          try:
              columns = {row[1] for row in connection.execute("PRAGMA table_info(users)").fetchall()}
              tables = {row[0] for row in connection.execute("SELECT name FROM sqlite_master WHERE type='table'").fetchall()}
              required = {"alembic_version", "catalog_courses", "catalog_sources"}
              if "is_admin" not in columns:
                  raise SystemExit("users.is_admin was not migrated")
              missing = required - tables
              if missing:
                  raise SystemExit(f"Missing migrated tables: {sorted(missing)}")
          finally:
              connection.close()
          '@ | Set-Content -Path $verifyScript -Encoding UTF8
          $env:STUDYOS_ENV = "desktop"
          $env:STUDYOS_DATABASE_URL = "sqlite:///$($dbPath -replace '\\','/')"
          $env:STUDYOS_DATA_DIR = $uploadPath
          $env:STUDYOS_DESKTOP_HOST = "127.0.0.1"
          $env:STUDYOS_DESKTOP_PORT = "8766"
          $backend = Start-Process "desktop/build/backend/StudyOSBackend/StudyOSBackend.exe" -PassThru
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 90; $attempt++) {
              try {
                $response = Invoke-WebRequest "http://127.0.0.1:8766/api/v1/health/ready" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $healthy = $true; break }
              } catch {}
              if ($backend.HasExited) { throw "Bundled backend exited during legacy database migration smoke" }
              Start-Sleep -Milliseconds 500
            }
            if (-not $healthy) { throw "Bundled backend never became ready after legacy database migration" }
            python $verifyScript $dbPath
            if ($LASTEXITCODE -ne 0) { throw "Legacy database migration verification failed" }
          } finally {
            if (-not $backend.HasExited) { Stop-Process -Id $backend.Id -Force }
          }

      - name: Smoke bundled backend
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP "studyos-backend-smoke"
          New-Item -ItemType Directory -Path $smokeRoot -Force | Out-Null
          $dbPath = Join-Path $smokeRoot "smoke.db"
          $uploadPath = Join-Path $smokeRoot "uploads"
          $env:STUDYOS_ENV = "desktop"
          $env:STUDYOS_DATABASE_URL = "sqlite:///$($dbPath -replace '\\','/')"
          $env:STUDYOS_DATA_DIR = $uploadPath
          $env:STUDYOS_DESKTOP_HOST = "127.0.0.1"
          $env:STUDYOS_DESKTOP_PORT = "8765"
          $backend = Start-Process "desktop/build/backend/StudyOSBackend/StudyOSBackend.exe" -PassThru
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try {
                $response = Invoke-WebRequest "http://127.0.0.1:8765/api/v1/health/ready" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $healthy = $true; break }
              } catch {}
              if ($backend.HasExited) { throw "Bundled backend exited during startup" }
              Start-Sleep -Milliseconds 500
            }
            if (-not $healthy) { throw "Bundled backend never became ready" }
          } finally {
            if (-not $backend.HasExited) { Stop-Process -Id $backend.Id -Force }
          }

      - name: Install web dependencies
        working-directory: web
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Build StudyOS web shell
        working-directory: web
        shell: pwsh
        env:
          STUDYOS_BACKEND_URL: http://127.0.0.1:8000
        run: npm run build

      - name: Stage production web runtime
        shell: pwsh
        run: |
          $stage = "desktop/build/web"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -Recurse -Force "web/.next/standalone/*" $stage
          Copy-Item -Recurse -Force "web/.next/static" "$stage/.next/static"
          Copy-Item -Recurse -Force "web/public" "$stage/public"
          if (!(Test-Path "$stage/server.js")) { throw "Missing staged Next standalone server" }

      - name: Install desktop dependencies
        working-directory: desktop
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Verify desktop source
        working-directory: desktop
        shell: pwsh
        run: npm run verify

      - name: Show electron-builder version
        working-directory: desktop
        shell: pwsh
        run: npx electron-builder --version

      - name: Build Windows installer
        working-directory: desktop
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:win

      - name: Build Microsoft Store AppX
        id: build-store
        working-directory: desktop
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          DEBUG: "electron-builder*"
          STORE_IDENTITY_NAME: ${{ vars.STUDYOS_STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STUDYOS_STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STUDYOS_STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          $configured = @(
            -not [string]::IsNullOrWhiteSpace($env:STORE_IDENTITY_NAME),
            -not [string]::IsNullOrWhiteSpace($env:STORE_PUBLISHER),
            -not [string]::IsNullOrWhiteSpace($env:STORE_PUBLISHER_DISPLAY_NAME)
          )
          $configuredCount = ($configured | Where-Object { $_ }).Count
          if ($configuredCount -ne 0 -and $configuredCount -ne 3) {
            throw "Configure all three Microsoft Store repository variables or leave all three unset."
          }
          try {
            if ($configuredCount -eq 3) {
              npx electron-builder --win appx --publish never `
                --config.appx.identityName="$env:STORE_IDENTITY_NAME" `
                --config.appx.publisher="$env:STORE_PUBLISHER" `
                --config.appx.publisherDisplayName="$env:STORE_PUBLISHER_DISPLAY_NAME"
            } else {
              npm run dist:store
            }
            if ($LASTEXITCODE -ne 0) {
              throw "electron-builder AppX build exited with code $LASTEXITCODE"
            }
          } catch {
            Write-Host "::group::AppX mapping diagnostics"
            $mappingFiles = Get-ChildItem "dist" -Filter "mapping.txt" -Recurse -File -ErrorAction SilentlyContinue
            if ($mappingFiles.Count -eq 0) {
              Write-Host "No mapping.txt found under desktop/dist"
            } else {
              foreach ($mapping in $mappingFiles) {
                Write-Host "===== $($mapping.FullName) ====="
                Get-Content $mapping.FullName
              }
            }
            $manifestFiles = Get-ChildItem "dist" -Filter "AppxManifest.xml" -Recurse -File -ErrorAction SilentlyContinue
            if ($manifestFiles.Count -eq 0) {
              Write-Host "No AppxManifest.xml found under desktop/dist"
            } else {
              foreach ($manifest in $manifestFiles) {
                Write-Host "===== $($manifest.FullName) ====="
                Get-Content $manifest.FullName
              }
            }
            Write-Host "::endgroup::"
            Write-Host "::group::Potentially invalid package paths"
            $invalid = Get-ChildItem "dist/win-unpacked" -Recurse -Force -File -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -match '[<>:\"|?*]' -or
                $_.Name -match '[ .]$' -or
                $_.BaseName -match '^(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])$'
              }
            if ($invalid) {
              $invalid | ForEach-Object { Write-Host $_.FullName }
            } else {
              Write-Host "No obvious invalid Windows filenames found in win-unpacked"
            }
            $makeAppx = Get-ChildItem "$env:LOCALAPPDATA/electron-builder/Cache/winCodeSign" -Filter "makeappx.exe" -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($makeAppx) {
              Write-Host "MakeAppx tool: $($makeAppx.FullName)"
              & $makeAppx.FullName /?
            } else {
              Write-Host "No cached makeappx.exe found"
            }
            Write-Host "::endgroup::"
            throw
          }

          $storePackage = Get-ChildItem "dist/StudyOS-*-Microsoft-Store-x64.appx" | Select-Object -First 1
          if (-not $storePackage) {
            throw "Missing Microsoft Store .appx package"
          }
          Write-Host "Created Store package: $($storePackage.FullName)"
          Write-Host "Size: $([math]::Round($storePackage.Length / 1MB, 2)) MB"

      - name: Verify release signature
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "desktop/dist/StudyOS-Windows-x64-Setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Missing StudyOS installer for signature verification" }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "Valid") {
            throw "StudyOS installer is not signed with a valid Authenticode certificate: $($signature.Status)"
          }

      - name: Verify desktop update metadata
        shell: pwsh
        run: |
          $metadata = "desktop/dist/latest.yml"
          if (!(Test-Path $metadata)) { throw "Missing latest.yml auto-update metadata" }
          $raw = Get-Content $metadata -Raw
          if ($raw -notmatch "StudyOS-Windows-x64-Setup\.exe") {
            throw "latest.yml does not reference the StudyOS Windows installer"
          }

      - name: Verify packaged web runtime
        shell: pwsh
        run: |
          $runtime = "desktop/dist/win-unpacked/resources/web/server.js"
          if (!(Test-Path $runtime)) {
            throw "Packaged desktop app is missing the production Next.js runtime"
          }

      - name: Smoke packaged installed payload
        shell: pwsh
        run: |
          $appExe = "desktop/dist/win-unpacked/StudyOS.exe"
          if (!(Test-Path $appExe)) { throw "Packaged StudyOS.exe is missing" }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: StudyOS-Windows
          path: |
            desktop/dist/StudyOS-Windows-x64-Setup.exe
            desktop/dist/StudyOS-*-Windows-x64-Portable.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          if-no-files-found: error

      - name: Upload Microsoft Store package
        uses: actions/upload-artifact@v7
        with:
          name: StudyOS-Microsoft-Store
          path: desktop/dist/StudyOS-*-Microsoft-Store-x64.appx
          if-no-files-found: error

      - name: Upload AppX diagnostics on failure
        if: failure() && steps.build-store.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: StudyOS-AppX-diagnostics
          path: |
            desktop/dist/**/mapping.txt
            desktop/dist/**/AppxManifest.xml
          if-no-files-found: ignore

      - name: Attach installers to published release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $installer = Get-ChildItem "desktop/dist/StudyOS-Windows-x64-Setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Missing StudyOS installer" }
          $assets = @($installer.FullName, (Resolve-Path "desktop/dist/latest.yml").Path)
          $portable = Get-ChildItem "desktop/dist/StudyOS-*-Windows-x64-Portable.exe" | Select-Object -First 1
          if ($portable) { $assets += $portable.FullName }
          $blockmap = Get-ChildItem "desktop/dist/*.blockmap" | Select-Object -First 1
          if ($blockmap) { $assets += $blockmap.FullName }
          $storePackage = Get-ChildItem "desktop/dist/StudyOS-*-Microsoft-Store-x64.appx" | Select-Object -First 1
          if ($storePackage) { $assets += $storePackage.FullName }
          gh release upload $env:RELEASE_TAG @assets --clobber
