name: Deployment Smoke

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "web/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/deploy-smoke.yml"
  pull_request:
    paths:
      - "backend/**"
      - "web/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/deploy-smoke.yml"
  workflow_dispatch:

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      POSTGRES_PASSWORD: smoke-password
      STUDYOS_WEB_PORT: "3000"
      STUDYOS_RELEASE: ci-smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for healthy services
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            backend_id="$(docker compose ps -q backend)"
            postgres_id="$(docker compose ps -q postgres)"
            if [ -n "$backend_id" ] && [ -n "$postgres_id" ]; then
              backend_health="$(docker inspect --format='{{.State.Health.Status}}' "$backend_id")"
              postgres_health="$(docker inspect --format='{{.State.Health.Status}}' "$postgres_id")"
              if [ "$backend_health" = "healthy" ] && [ "$postgres_health" = "healthy" ]; then
                exit 0
              fi
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Smoke web topology
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color web backend
          exit 1

      - name: Verify API through web proxy
        run: |
          curl --fail --silent --show-error             http://127.0.0.1:3000/api/v1/health/ready             | grep '"status":"ready"'

      - name: Install browser E2E dependencies
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Browser E2E
        working-directory: web
        env:
          STUDYOS_E2E_BASE_URL: http://127.0.0.1:3000
        run: npm run e2e

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
