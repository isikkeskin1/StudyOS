name: Backend CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Migration smoke test
        env:
          STUDYOS_DATABASE_URL: sqlite:///./migration-smoke.db
        run: alembic upgrade head

      - name: Test
        run: pytest

      - name: Build backend container
        run: docker build -f Dockerfile ..
