[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "studyos-backend"
version = "0.51.0"
description = "Backend services for StudyOS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "alembic>=1.14,<2.0",
    "openai>=2.0,<3.0",
    "pydantic>=2.9,<3.0",
    "pypdf>=5.9,<7.0",
    "python-docx>=1.2,<2.0",
    "python-multipart>=0.0.12,<1.0",
    "python-pptx>=1.0,<2.0",
    "pywebpush>=2.0,<3.0",
    "sentry-sdk>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.6,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"alembic/**/*.py" = ["I001"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]
