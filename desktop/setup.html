<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; img-src 'self' data:;" />
  <title>StudyOS Setup</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background:
        radial-gradient(circle at 25% 10%, rgba(124,58,237,.22), transparent 38%),
        radial-gradient(circle at 85% 85%, rgba(14,165,233,.14), transparent 34%),
        #070b11; color: #f8fafc;
    }
    main {
      width: min(520px, calc(100vw - 48px));
      padding: 34px; border: 1px solid rgba(148,163,184,.16);
      border-radius: 24px; background: rgba(12,18,28,.92);
      box-shadow: 0 30px 100px rgba(0,0,0,.45);
    }
    .mark {
      width: 52px; height: 52px; display: grid; place-items: center; border-radius: 16px;
      background: linear-gradient(135deg,#7c3aed,#2563eb); font-size: 28px; box-shadow: 0 16px 40px rgba(124,58,237,.28);
    }
    h1 { margin: 22px 0 8px; font-size: 30px; letter-spacing: -.03em; }
    p { margin: 0; color: #94a3b8; line-height: 1.6; font-size: 14px; }
    label { display: grid; gap: 8px; margin-top: 24px; color: #cbd5e1; font-size: 12px; font-weight: 700; }
    input {
      width: 100%; min-height: 48px; padding: 0 14px; border: 1px solid rgba(148,163,184,.22);
      border-radius: 12px; background: #080d14; color: #f8fafc; outline: none; font-size: 14px;
    }
    input:focus { border-color: #7c3aed; box-shadow: 0 0 0 3px rgba(124,58,237,.14); }
    button {
      width: 100%; min-height: 48px; margin-top: 14px; border: 0; border-radius: 12px;
      background: linear-gradient(135deg,#7c3aed,#2563eb); color: white; font-weight: 800; cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: wait; }
    #status { min-height: 20px; margin-top: 12px; color: #fca5a5; font-size: 12px; }
    .note { margin-top: 20px; padding-top: 18px; border-top: 1px solid rgba(148,163,184,.12); font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="mark">🧠</div>
    <h1>StudyOS couldn't start</h1>
    <p id="summary">The bundled desktop services did not start correctly. You can retry the local StudyOS runtime or connect to a hosted StudyOS server.</p>
    <div id="startup-error" style="display:none;margin-top:16px;padding:12px 14px;border:1px solid rgba(248,113,113,.25);border-radius:10px;background:rgba(127,29,29,.12);color:#fecaca;font-size:12px;line-height:1.5;word-break:break-word;"></div>
    <button id="retry-local" type="button">Retry bundled local StudyOS</button>
    <p id="log-path" class="note" style="margin-top:10px;padding-top:0;border-top:0;"></p>
    <button id="open-diagnostics" type="button" style="margin-top:8px;background:#111827;border:1px solid rgba(148,163,184,.2);">Open diagnostics folder</button>
    <form id="form">
      <label>
        StudyOS server URL
        <input id="url" type="url" required placeholder="https://api.your-studyos-domain.com" autocomplete="url" />
      </label>
      <button id="submit" type="submit">Connect to hosted StudyOS</button>
      <div id="status" role="alert"></div>
    </form>
    <p class="note">Remote servers must use HTTPS. Local development may use http://localhost or http://127.0.0.1.</p>
  </main>
  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("url");
    const button = document.getElementById("submit");
    const retryLocal = document.getElementById("retry-local");
    const status = document.getElementById("status");
    const startupError = document.getElementById("startup-error");
    const logPath = document.getElementById("log-path");
    const openDiagnostics = document.getElementById("open-diagnostics");

    window.studyosDesktop.getStartupError().then(({ message, logPath: path }) => {
      if (message) {
        startupError.style.display = "block";
        startupError.textContent = message;
      }
      if (path) logPath.textContent = `Diagnostic log: ${path}`;
    }).catch(() => {});

    openDiagnostics.addEventListener("click", async () => {
      try {
        await window.studyosDesktop.openDiagnostics();
      } catch (error) {
        status.textContent = error?.message || "Could not open diagnostics folder.";
      }
    });

    retryLocal.addEventListener("click", async () => {
      retryLocal.disabled = true;
      button.disabled = true;
      status.textContent = "Retrying local StudyOS…";
      try {
        await window.studyosDesktop.useLocalBackend();
      } catch (error) {
        status.textContent = error?.message || "Local StudyOS could not start.";
        retryLocal.disabled = false;
        button.disabled = false;
      }
    });
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      status.textContent = "";
      try {
        await window.studyosDesktop.saveBackendUrl(input.value);
      } catch (error) {
        status.textContent = error?.message || "Could not save the StudyOS server.";
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
