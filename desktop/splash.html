<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; img-src 'self' data:;" />
  <title>StudyOS</title>
  <style>
    :root { color-scheme:dark; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; overflow:hidden;
      background:
        radial-gradient(circle at 50% 28%, rgba(124,58,237,.25), transparent 36%),
        #070b11; color:#f8fafc;
    }
    main { display:grid; justify-items:center; gap:15px; }
    .mark {
      width:72px;height:72px;display:grid;place-items:center;border-radius:22px;
      background:linear-gradient(135deg,#7c3aed,#2563eb);font-size:38px;
      box-shadow:0 24px 70px rgba(124,58,237,.34);
      animation:float 2s ease-in-out infinite;
    }
    h1 { margin:3px 0 0; font-size:30px; letter-spacing:-.04em; }
    #status { color:#91a4b8; font-size:13px; min-width:260px; text-align:center; }
    .dots { display:flex; gap:7px; }
    .dots span { width:7px;height:7px;border-radius:50%;background:#6f7e90;animation:pulse 1.2s ease-in-out infinite; }
    .dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
    @keyframes pulse {0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.12)}}
    @keyframes float {0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  </style>
</head>
<body>
  <main>
    <div class="mark">🧠</div>
    <h1>StudyOS</h1>
    <div id="status">Starting your workspace…</div>
    <div class="dots"><span></span><span></span><span></span></div>
  </main>
  <script>
    const status = document.getElementById("status");
    window.studyosDesktop.onStartupProgress((message) => {
      if (message) status.textContent = message;
    });
  </script>
</body>
</html>
